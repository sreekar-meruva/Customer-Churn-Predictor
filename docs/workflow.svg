<svg width="680" height="832" viewBox="0 0 680 832" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Monitor, alert, and retrain workflow</title>
<style>
text{font-family:Arial,Helvetica,sans-serif}
.th{font-size:14px;font-weight:600}
.ts{font-size:12px}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.75}
.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-coral rect{fill:#FAECE7;stroke:#993C1D;stroke-width:0.75}
.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-amber rect{fill:#FAEEDA;stroke:#854F0B;stroke-width:0.75}
.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-green rect{fill:#EAF3DE;stroke:#3B6D11;stroke-width:0.75}
.c-green .th{fill:#27500A}.c-green .ts{fill:#3B6D11}
.label{fill:#5F5E5A}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<line x1="340" y1="96" x2="340" y2="156" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="212" x2="340" y2="272" class="arr" marker-end="url(#arrow)"/>
<text class="ts label" x="350" y="246">Critical</text>
<line x1="340" y1="328" x2="340" y2="388" class="arr" marker-end="url(#arrow)"/>
<text class="ts label" x="350" y="362">8+ weeks</text>
<line x1="340" y1="444" x2="340" y2="504" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="560" x2="340" y2="620" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="676" x2="340" y2="736" class="arr" marker-end="url(#arrow)"/>
<text class="ts label" x="350" y="710">Approve</text>

<line x1="500" y1="184" x2="514" y2="184" class="arr" marker-end="url(#arrow)"/>
<text class="ts label" x="520" y="180">OK / WATCH / ALERT</text>
<text class="ts label" x="520" y="196">&#8635; resume weekly</text>

<line x1="500" y1="300" x2="514" y2="300" class="arr" marker-end="url(#arrow)"/>
<text class="ts label" x="520" y="296">No</text>
<text class="ts label" x="520" y="312">&#8635; resume weekly</text>

<line x1="500" y1="648" x2="514" y2="648" class="arr" marker-end="url(#arrow)"/>
<text class="ts label" x="520" y="644">Reject</text>
<text class="ts label" x="520" y="660">Champion stays</text>

<g class="c-teal">
<rect x="180" y="40" width="320" height="56" rx="8"/>
<text class="th" x="340" y="63" text-anchor="middle">Score &amp; monitor</text>
<text class="ts" x="340" y="83" text-anchor="middle">Weekly batch scoring + drift check</text>
</g>

<g class="c-teal">
<rect x="180" y="156" width="320" height="56" rx="8"/>
<text class="th" x="340" y="179" text-anchor="middle">Alert log</text>
<text class="ts" x="340" y="199" text-anchor="middle">OK / WATCH / ALERT / CRITICAL</text>
</g>

<g class="c-amber">
<rect x="180" y="272" width="320" height="56" rx="8"/>
<text class="th" x="340" y="295" text-anchor="middle">Critical streak check</text>
<text class="ts" x="340" y="315" text-anchor="middle">8+ consecutive CRITICAL weeks?</text>
</g>

<g class="c-coral">
<rect x="180" y="388" width="320" height="56" rx="8"/>
<text class="th" x="340" y="411" text-anchor="middle">Retrain &amp; evaluate</text>
<text class="ts" x="340" y="431" text-anchor="middle">Candidate vs champion (F2, Brier)</text>
</g>

<g class="c-coral">
<rect x="180" y="504" width="320" height="56" rx="8"/>
<text class="th" x="340" y="527" text-anchor="middle">Recommend</text>
<text class="ts" x="340" y="547" text-anchor="middle">Comparison report surfaced</text>
</g>

<g class="c-amber">
<rect x="180" y="620" width="320" height="56" rx="8"/>
<text class="th" x="340" y="643" text-anchor="middle">Human approval</text>
<text class="ts" x="340" y="663" text-anchor="middle">Approve or reject candidate</text>
</g>

<g class="c-green">
<rect x="180" y="736" width="320" height="56" rx="8"/>
<text class="th" x="340" y="759" text-anchor="middle">Promote</text>
<text class="ts" x="340" y="779" text-anchor="middle">Swap artifact + metadata</text>
</g>
</svg>
