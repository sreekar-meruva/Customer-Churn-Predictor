<svg width="680" height="590" viewBox="0 0 680 590" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Churn prediction pipeline architecture</title>
<style>
text{font-family:Arial,Helvetica,sans-serif}
.th{font-size:14px;font-weight:600}
.ts{font-size:12px}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.75}
.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-coral rect{fill:#FAECE7;stroke:#993C1D;stroke-width:0.75}
.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.75}
.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.75}
.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g class="c-gray">
<rect x="250" y="30" width="180" height="50" rx="8"/>
<text class="th" x="340" y="51" text-anchor="middle">Web UI</text>
<text class="ts" x="340" y="69" text-anchor="middle">Upload &amp; approve</text>
</g>
<line x1="340" y1="80" x2="340" y2="110" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
<rect x="50" y="110" width="580" height="260" rx="20"/>
<text class="th" x="72" y="138">Backend services</text>
<text class="ts" x="72" y="156">Cloud Run &#183; 4 containers</text>
</g>

<g class="c-teal">
<rect x="80" y="172" width="250" height="70" rx="10"/>
<text class="th" x="205" y="199" text-anchor="middle">Prediction service</text>
<text class="ts" x="205" y="219" text-anchor="middle">Real-time scoring API</text>
</g>
<g class="c-teal">
<rect x="350" y="172" width="250" height="70" rx="10"/>
<text class="th" x="475" y="199" text-anchor="middle">Data ingestion service</text>
<text class="ts" x="475" y="219" text-anchor="middle">Reads &amp; writes Snowflake</text>
</g>
<g class="c-coral">
<rect x="80" y="262" width="250" height="70" rx="10"/>
<text class="th" x="205" y="289" text-anchor="middle">Training service</text>
<text class="ts" x="205" y="309" text-anchor="middle">Retrains &amp; evaluates model</text>
</g>
<g class="c-coral">
<rect x="350" y="262" width="250" height="70" rx="10"/>
<text class="th" x="475" y="289" text-anchor="middle">Monitoring service</text>
<text class="ts" x="475" y="309" text-anchor="middle">Weekly drift &amp; severity</text>
</g>

<line x1="340" y1="370" x2="340" y2="400" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
<rect x="50" y="400" width="580" height="150" rx="20"/>
<text class="th" x="72" y="428">Data &amp; storage</text>
</g>

<g class="c-purple">
<rect x="80" y="462" width="250" height="60" rx="10"/>
<text class="th" x="205" y="487" text-anchor="middle">Snowflake</text>
<text class="ts" x="205" y="507" text-anchor="middle">Predictions, actuals, logs</text>
</g>
<g class="c-purple">
<rect x="350" y="462" width="250" height="60" rx="10"/>
<text class="th" x="475" y="487" text-anchor="middle">Model artifacts</text>
<text class="ts" x="475" y="507" text-anchor="middle">Model file + metadata</text>
</g>
</svg>
