services:
  prediction-service:
    build: ./services/prediction_service
    ports:
      - "8001:8000"
  
  data-ingestion-service:
    build: ./services/data_ingestion_service
    ports:
      - "8002:8000"
    env_file:
      - .env
    
  training-service:
    build: ./services/training_service
    ports:
      - "8003:8000"
    environment:
      - PREDICTION_SERVICE_URL=http://prediction-service:8000
      - DATA_INGESTION_SERVICE_URL=http://data-ingestion-service:8000
      - MONITORING_SERVICE_URL=http://monitoring-service:8000
    
  monitoring-service:
    build: ./services/monitoring_service
    ports:
      - "8004:8000"
    environment:
      - PREDICTION_SERVICE_URL=http://prediction-service:8000
      - DATA_INGESTION_SERVICE_URL=http://data-ingestion-service:8000
      - TRAINING_SERVICE_URL=http://training-service:8000